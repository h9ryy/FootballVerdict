<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FootballVerdict</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div id="pts"></div>
    <button id="profileBtn" data-tab="profile" aria-label="Профиль">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c.6-3.7 3.7-5.8 7.5-5.8s6.9 2.1 7.5 5.8"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <nav id="nav">
    <button data-tab="favs">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.6l-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg></span>Избранное
    </button>
    <button data-tab="history">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg></span>История
    </button>
    <button data-tab="home" class="home">
      <span class="ico emoji">⚽</span>Лиги
    </button>
    <button data-tab="ranks">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="7"/><path d="M8.500 14.500L6.500 22 12 19l5.500 3-2-7.500"/></svg></span>Звания
    </button>
    <button data-tab="rating">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5.2a4 4 0 0 1-8 0z" fill="currentColor" fill-opacity=".22"/><path d="M8 6H5.2v1.6A3.2 3.2 0 0 0 8 10.8M16 6h2.8v1.6a3.2 3.2 0 0 1-2.8 3.2M12 13.2V17M8.6 20h6.8M9.8 17h4.4"/></svg></span>Рейтинг
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
